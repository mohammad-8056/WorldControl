# WorldControl - فارسی
#
# این متن‌ها داخل بازی خودکار با libPersianText شکل‌دهی و راست‌به‌چپ می‌شوند.
# نکته‌ها برای ویرایش:
#  - از نیم‌فاصله استفاده کنید (می‌شود)؛ در بازی دیده نمی‌شود ولی حروف را درست جدا می‌کند.
#  - از ی و ک فارسی و رقم انگلیسی استفاده کنید. به جای ٪ بنویسید «درصد».
#  - {placeholder} ها را تغییر ندهید. {prefix} همان پیشوند پایین است.
#  - اولین کلمه هر خط سمت راست نمایش داده می‌شود؛ برای همین در راهنما اول توضیح آمده و بعد دستور.

